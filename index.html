<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#F5F2EC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="PinaWoof - Accesorios con amor para tu mascota" />
    <link rel="icon" type="image/png" href="/brand/pinawoof-dog.png" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>PinaWoof — Accesorios con Amor</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Poppins', sans-serif; -webkit-font-smoothing: antialiased; }
      @keyframes slideDown {
        from { transform: translate(-50%, -20px); opacity: 0; }
        to { transform: translate(-50%, 0); opacity: 1; }
      }
      @keyframes slideIn {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      input:focus, select:focus {
        border-color: #9C3A4C !important;
        box-shadow: 0 0 0 3px rgba(156,58,74,0.15);
      }
      button { transition: transform 0.15s ease, opacity 0.15s ease; }
      button:active { transform: scale(0.96); }
      ::-webkit-scrollbar { height: 4px; width: 4px; }
      ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }
      .k4p-card { transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; }
      .k4p-card:hover { transform: translateY(-4px); border-color: rgba(156,58,74,0.4) !important; box-shadow: 0 10px 24px rgba(26,26,26,0.08); }
      .k4p-header { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
